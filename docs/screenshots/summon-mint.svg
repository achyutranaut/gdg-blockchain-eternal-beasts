<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  
  <text x="100" y="60" fill="#EA580C" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">✨ SUMMONING ALTAR</text>
  <text x="100" y="100" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="900">Summon an Elemental Beast</text>

  <!-- Left: Live Hologram Preview -->
  <g transform="translate(100, 130)">
    <rect width="360" height="440" rx="20" fill="#18181B" stroke="#3B82F6" stroke-width="2"/>
    <rect x="15" y="15" width="330" height="280" rx="14" fill="#09090B"/>
    <text x="180" y="170" text-anchor="middle" font-size="70">💧</text>
    <text x="25" y="325" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Thalassa Tide</text>
    <text x="25" y="345" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">WATER • EPIC</text>
    <rect x="25" y="365" width="310" height="40" rx="8" fill="#27272A"/>
    <text x="40" y="390" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">ATK: 78 | DEF: 88 | SPD: 72</text>
  </g>

  <!-- Right: Form Controls -->
  <g transform="translate(500, 130)">
    <rect width="600" height="440" rx="20" fill="#18181B" stroke="#27272A"/>
    <text x="30" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. Select Element</text>
    <!-- Element buttons -->
    <rect x="30" y="55" width="80" height="45" rx="8" fill="#27272A" stroke="#EF4444"/>
    <text x="70" y="82" text-anchor="middle" fill="#EF4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🔥 Fire</text>

    <rect x="120" y="55" width="80" height="45" rx="8" fill="#3B82F6"/>
    <text x="160" y="82" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">💧 Water</text>

    <rect x="210" y="55" width="80" height="45" rx="8" fill="#27272A"/>
    <text x="250" y="82" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🌿 Earth</text>

    <rect x="300" y="55" width="80" height="45" rx="8" fill="#27272A"/>
    <text x="340" y="82" text-anchor="middle" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🌪️ Air</text>

    <rect x="390" y="55" width="80" height="45" rx="8" fill="#27272A"/>
    <text x="430" y="82" text-anchor="middle" fill="#EAB308" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ Lightn</text>

    <rect x="480" y="55" width="80" height="45" rx="8" fill="#27272A"/>
    <text x="520" y="82" text-anchor="middle" fill="#A855F7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🔮 Shadow</text>

    <!-- Name & Lore -->
    <text x="30" y="130" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. Identity &amp; Lore</text>
    <rect x="30" y="145" width="530" height="40" rx="8" fill="#09090B" stroke="#27272A"/>
    <text x="45" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">Tidecaller Thalassa</text>

    <!-- Stat sliders -->
    <text x="30" y="220" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. Combat Attributes</text>
    <rect x="30" y="240" width="530" height="8" rx="4" fill="#EF4444"/>
    <rect x="30" y="265" width="530" height="8" rx="4" fill="#3B82F6"/>
    <rect x="30" y="290" width="530" height="8" rx="4" fill="#EAB308"/>

    <!-- Submit button -->
    <rect x="30" y="340" width="530" height="55" rx="12" fill="#EA580C"/>
    <text x="295" y="374" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">✨ Summon Beast (Upload to IPFS &amp; Mint)</text>
  </g>
</svg>
