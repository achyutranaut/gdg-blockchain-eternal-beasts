<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  
  <!-- Back Button -->
  <text x="100" y="70" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">← Back to Explore</text>

  <!-- Left: Big Artwork Card -->
  <g transform="translate(100, 100)">
    <rect width="420" height="480" rx="24" fill="#18181B" stroke="#EF4444" stroke-width="2"/>
    <circle cx="210" cy="210" r="150" fill="#EF4444" fill-opacity="0.15" filter="blur(60px)"/>
    <rect x="20" y="20" width="380" height="380" rx="16" fill="#09090B"/>
    <text x="210" y="230" text-anchor="middle" font-size="90">🔥</text>
    <rect x="35" y="35" width="80" height="26" rx="8" fill="#09090B" fill-opacity="0.8" stroke="#27272A"/>
    <text x="75" y="52" text-anchor="middle" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">🔥 FIRE</text>
    
    <rect x="290" y="35" width="95" height="26" rx="8" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444"/>
    <text x="337" y="52" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">LEGENDARY</text>
  </g>

  <!-- Right: Beast Info & Actions -->
  <g transform="translate(560, 100)">
    <text x="0" y="30" fill="#EA580C" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">INFERNAL BLAZE &amp; FURY</text>
    <text x="0" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="900">Ignis Pyroth #1</text>
    <text x="0" y="105" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">Forged in the heart of volcanic fissures, Pyroth commands molten magma.</text>
    
    <!-- Stats Bars -->
    <rect x="0" y="140" width="540" height="150" rx="16" fill="#18181B" stroke="#27272A"/>
    <text x="20" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Attributes &amp; Combat Power</text>
    
    <text x="20" y="205" fill="#EF4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚔️ Attack: 95/100</text>
    <rect x="150" y="195" width="360" height="10" rx="5" fill="#09090B"/>
    <rect x="150" y="195" width="342" height="10" rx="5" fill="#EF4444"/>

    <text x="20" y="235" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🛡️ Defense: 70/100</text>
    <rect x="150" y="225" width="360" height="10" rx="5" fill="#09090B"/>
    <rect x="150" y="225" width="252" height="10" rx="5" fill="#3B82F6"/>

    <text x="20" y="265" fill="#EAB308" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ Speed: 85/100</text>
    <rect x="150" y="255" width="360" height="10" rx="5" fill="#09090B"/>
    <rect x="150" y="255" width="306" height="10" rx="5" fill="#EAB308"/>

    <!-- Action Buy Box -->
    <rect x="0" y="310" width="540" height="120" rx="16" fill="#18181B" stroke="#27272A"/>
    <text x="20" y="340" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">LISTING PRICE</text>
    <text x="20" y="375" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="bold">0.15 ETH</text>
    <rect x="260" y="340" width="250" height="50" rx="12" fill="#EA580C"/>
    <text x="385" y="370" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">🛒 Purchase Beast</text>
  </g>
</svg>
