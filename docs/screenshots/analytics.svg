<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  
  <text x="100" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="900">Marketplace Analytics</text>
  <text x="100" y="85" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">Real-time aggregate data indexed from Base Sepolia smart contract events</text>

  <!-- Metrics row -->
  <g transform="translate(100, 110)">
    <rect width="230" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    <text x="20" y="35" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">FLOOR PRICE</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="monospace" font-size="22" font-weight="bold">0.05 ETH</text>

    <rect x="255" y="0" width="230" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    <text x="275" y="35" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">TOTAL VOLUME</text>
    <text x="275" y="65" fill="#10B981" font-family="monospace" font-size="22" font-weight="bold">2.45 ETH</text>

    <rect x="510" y="0" width="230" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    <text x="530" y="35" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">TOTAL MINTED</text>
    <text x="530" y="65" fill="#FFFFFF" font-family="monospace" font-size="22" font-weight="bold">24 Cards</text>

    <rect x="765" y="0" width="235" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    <text x="785" y="35" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">UNIQUE HOLDERS</text>
    <text x="785" y="65" fill="#3B82F6" font-family="monospace" font-size="22" font-weight="bold">12 Wallets</text>
  </g>

  <!-- Charts Row -->
  <g transform="translate(100, 230)">
    <!-- Big Volume Chart -->
    <rect width="640" height="340" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="30" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Trading Volume Over Time (ETH)</text>
    <!-- Wave path -->
    <path d="M 40 280 Q 150 240, 220 200 T 360 160 T 480 120 T 600 80 L 600 300 L 40 300 Z" fill="#F97316" fill-opacity="0.15"/>
    <path d="M 40 280 Q 150 240, 220 200 T 360 160 T 480 120 T 600 80" stroke="#F97316" stroke-width="3" fill="none"/>

    <!-- Donut Affinity Chart -->
    <rect x="670" y="0" width="330" height="340" rx="18" fill="#18181B" stroke="#27272A"/>
    <text x="700" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Element Affinities</text>
    <circle cx="835" cy="180" r="70" stroke="#EF4444" stroke-width="24" stroke-dasharray="140 300" fill="none"/>
    <circle cx="835" cy="180" r="70" stroke="#3B82F6" stroke-width="24" stroke-dasharray="100 300" stroke-dashoffset="-140" fill="none"/>
    <circle cx="835" cy="180" r="70" stroke="#10B981" stroke-width="24" stroke-dasharray="80 300" stroke-dashoffset="-240" fill="none"/>
    <circle cx="835" cy="180" r="70" stroke="#EAB308" stroke-width="24" stroke-dasharray="60 300" stroke-dashoffset="-320" fill="none"/>
  </g>
</svg>
