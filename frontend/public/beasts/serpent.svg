<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgWater" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#060e1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="tide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glowWater" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgWater)"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#60a5fa" stroke-width="0.75" opacity="0.15" stroke-dasharray="6 14"/>
  <g transform="translate(400, 420)">
    <!-- Coils -->
    <path d="M-180,180 C-160,80 -80,60 -60,160 C-40,240 60,240 100,140 C140,40 40,-60 0,-120" fill="none" stroke="url(#tide)" stroke-width="36" stroke-linecap="round"/>
    <path d="M-180,180 C-160,80 -80,60 -60,160 C-40,240 60,240 100,140 C140,40 40,-60 0,-120" fill="none" stroke="#93c5fd" stroke-width="4" stroke-dasharray="12 24" opacity="0.6"/>
    <!-- Crest / Horns -->
    <path d="M0,-120 C-40,-160 -90,-220 -60,-260 C-40,-220 -20,-170 0,-140 C20,-170 40,-220 60,-260 C90,-220 40,-160 0,-120 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <!-- Head -->
    <polygon points="0,-160 -70,-80 -40,10 0,50 40,10 70,-80" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
    <polygon points="0,-130 -40,-70 0,-20 40,-70" fill="url(#tide)"/>
    <!-- Eyes -->
    <polygon points="-38,-70 -18,-65 -30,-50" fill="#93c5fd" filter="url(#glowWater)"/>
    <polygon points="38,-70 18,-65 30,-50" fill="#93c5fd" filter="url(#glowWater)"/>
    <!-- Mists / Water Droplets -->
    <circle cx="-140" cy="-140" r="3" fill="#60a5fa" filter="url(#glowWater)"/>
    <circle cx="150" cy="-120" r="2" fill="#93c5fd"/>
    <circle cx="-170" cy="80" r="3.5" fill="#3b82f6" filter="url(#glowWater)"/>
    <circle cx="160" cy="180" r="2.5" fill="#60a5fa"/>
  </g>
</svg>
