<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgShadow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#210a2e"/>
      <stop offset="60%" stop-color="#100517"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="umbra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgShadow)"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#7e22ce" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#c084fc" stroke-width="0.75" opacity="0.15" stroke-dasharray="5 15"/>
  <g transform="translate(400, 420)">
    <!-- Wings Folded -->
    <path d="M0,0 Q-100,-100 -180,-60 Q-160,120 0,220 Z" fill="#190924" stroke="#7e22ce" stroke-width="2"/>
    <path d="M0,0 Q100,-100 180,-60 Q160,120 0,220 Z" fill="#190924" stroke="#7e22ce" stroke-width="2"/>
    <!-- Head & Occult Feathers -->
    <polygon points="0,-180 -50,-100 -30,0 30,0 50,-100" fill="#291238" stroke="#a855f7" stroke-width="2"/>
    <!-- Curved Beak -->
    <path d="M0,-120 Q-10,-60 0,20 Q10,-60 0,-120 Z" fill="#0d0412" stroke="#9333ea" stroke-width="1.5"/>
    <!-- Glowing Eye -->
    <circle cx="-20" cy="-110" r="5" fill="#e9d5ff" filter="url(#glowShadow)"/>
    <circle cx="20" cy="-110" r="5" fill="#e9d5ff" filter="url(#glowShadow)"/>
    <!-- Occult Runes / Orbs -->
    <circle cx="-120" cy="-140" r="3" fill="#c084fc" filter="url(#glowShadow)"/>
    <circle cx="130" cy="-130" r="2.5" fill="#e9d5ff"/>
    <circle cx="-150" cy="60" r="2" fill="#a855f7"/>
    <circle cx="140" cy="80" r="3" fill="#c084fc" filter="url(#glowShadow)"/>
  </g>
</svg>
