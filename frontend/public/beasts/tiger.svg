<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgTiger" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2b1406"/>
      <stop offset="60%" stop-color="#140902"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="tigerStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="glowTiger" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgTiger)"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.25"/>
  <g transform="translate(400, 420)">
    <!-- Ears -->
    <polygon points="-110,-120 -150,-210 -60,-140" fill="#1f0e04" stroke="#ea580c" stroke-width="2"/>
    <polygon points="110,-120 150,-210 60,-140" fill="#1f0e04" stroke="#ea580c" stroke-width="2"/>
    <!-- Head Base -->
    <polygon points="0,-160 -110,-60 -80,60 0,120 80,60 110,-60" fill="url(#tigerStripe)" stroke="#ea580c" stroke-width="2"/>
    <!-- Stripes -->
    <polygon points="0,-120 -30,-80 -10,-80" fill="#080808"/>
    <polygon points="0,-120 30,-80 10,-80" fill="#080808"/>
    <polygon points="-90,-30 -50,-20 -80,0" fill="#080808"/>
    <polygon points="90,-30 50,-20 80,0" fill="#080808"/>
    <!-- Snout & Fangs -->
    <polygon points="0,-20 -35,30 0,70 35,30" fill="#170c04" stroke="#ea580c" stroke-width="1.5"/>
    <polygon points="-15,50 -10,75 -5,50" fill="#ffffff"/>
    <polygon points="15,50 10,75 5,50" fill="#ffffff"/>
    <!-- Eyes -->
    <polygon points="-50,-40 -25,-35 -40,-25" fill="#fde047" filter="url(#glowTiger)"/>
    <polygon points="50,-40 25,-35 40,-25" fill="#fde047" filter="url(#glowTiger)"/>
  </g>
</svg>
