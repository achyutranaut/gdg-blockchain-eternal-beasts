<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgEarth" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2417"/>
      <stop offset="60%" stop-color="#08140c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="strata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="glowEarth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgEarth)"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#15803d" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#4ade80" stroke-width="0.75" opacity="0.15" stroke-dasharray="10 10"/>
  <g transform="translate(400, 420)">
    <!-- Carapace Base -->
    <path d="M0,-160 C160,-160 220,-40 200,120 C180,240 -180,240 -200,120 C-220,-40 -160,-160 0,-160 Z" fill="#142018" stroke="#15803d" stroke-width="3"/>
    <!-- Shell Hexagonal Plates -->
    <polygon points="0,-120 70,-80 70,0 0,40 -70,0 -70,-80" fill="url(#strata)" stroke="#4ade80" stroke-width="1.5"/>
    <polygon points="0,40 70,80 70,160 0,200 -70,160 -70,80" fill="#0f291e" stroke="#15803d" stroke-width="1.5"/>
    <polygon points="70,-80 140,-50 140,30 70,0" fill="#133827" stroke="#15803d" stroke-width="1.5"/>
    <polygon points="-70,-80 -140,-50 -140,30 -70,0" fill="#133827" stroke="#15803d" stroke-width="1.5"/>
    <!-- Head -->
    <polygon points="0,-240 -40,-180 -25,-130 25,-130 40,-180" fill="#1f3b2b" stroke="#4ade80" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-18" cy="-190" r="5" fill="#86efac" filter="url(#glowEarth)"/>
    <circle cx="18" cy="-190" r="5" fill="#86efac" filter="url(#glowEarth)"/>
    <!-- Spores -->
    <circle cx="-160" cy="-120" r="3" fill="#86efac" filter="url(#glowEarth)"/>
    <circle cx="170" cy="-100" r="2.5" fill="#4ade80"/>
    <circle cx="-180" cy="140" r="2" fill="#86efac"/>
    <circle cx="190" cy="120" r="3" fill="#22c55e"/>
  </g>
</svg>
