<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgAir" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2330"/>
      <stop offset="60%" stop-color="#08141c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="zephyr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glowAir" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgAir)"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.15" stroke-dasharray="12 8"/>
  <g transform="translate(400, 410)">
    <!-- Wingspan -->
    <path d="M0,40 Q-140,-80 -260,-160 Q-180,60 -60,180 Z" fill="#0f2838" stroke="#0284c7" stroke-width="2"/>
    <path d="M0,40 Q140,-80 260,-160 Q180,60 60,180 Z" fill="#0f2838" stroke="#0284c7" stroke-width="2"/>
    <!-- Wing Feathers Layers -->
    <path d="M0,0 Q-120,-60 -210,-120 Q-140,40 -40,130 Z" fill="url(#zephyr)" opacity="0.6"/>
    <path d="M0,0 Q120,-60 210,-120 Q140,40 40,130 Z" fill="url(#zephyr)" opacity="0.6"/>
    <!-- Head & Crest -->
    <polygon points="0,-180 -40,-100 -25,0 25,0 40,-100" fill="#16394f" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="0,-220 -20,-160 20,-160" fill="#38bdf8"/>
    <!-- Beak -->
    <polygon points="0,-120 -15,-90 0,-40 15,-90" fill="#f59e0b"/>
    <!-- Eyes -->
    <polygon points="-25,-120 -10,-115 -20,-105" fill="#fef08a" filter="url(#glowAir)"/>
    <polygon points="25,-120 10,-115 20,-105" fill="#fef08a" filter="url(#glowAir)"/>
  </g>
</svg>
